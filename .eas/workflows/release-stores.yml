# Store-Release: Play Alpha + iOS → App Store Connect
#
# iOS: externe Gruppe „Tester“ braucht auf Expo Free Plan noch einen Tap in ASC
# (testflight-Job mit build_id = Paid). Nach Submit: Build in Gruppe Tester legen.
#
# Manuell: npm run release:stores

name: Release Android + iOS

on:
  workflow_dispatch: {}

jobs:
  build_android:
    name: Build Android (AAB)
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit Play Alpha
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  build_ios:
    name: Build iOS (production)
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit iOS → ASC
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
