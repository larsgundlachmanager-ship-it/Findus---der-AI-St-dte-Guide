name: regression-gate

on:
  push:
    branches: [main, master]
    paths:
      - 'src/module2/**'
      - 'src/services/audio/**'
      - 'src/services/concierge/**'
      - 'src/services/boot/**'
      - 'src/services/ui/uiInstant.smoke.test.ts'
      - 'src/components/homeMap/**'
      - 'src/store/**'
      - 'src/constants/uiLayers.ts'
      - 'scripts/run-regression-gate.ts'
      - 'package.json'
  pull_request:
    paths:
      - 'src/module2/**'
      - 'src/services/audio/**'
      - 'src/services/concierge/**'
      - 'src/services/boot/**'
      - 'src/services/ui/uiInstant.smoke.test.ts'
      - 'src/components/homeMap/**'
      - 'src/store/**'
      - 'src/constants/uiLayers.ts'
      - 'scripts/run-regression-gate.ts'
      - 'package.json'

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:regression-gate
