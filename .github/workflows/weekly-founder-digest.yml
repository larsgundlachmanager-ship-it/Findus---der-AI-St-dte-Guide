# Sonntag 18:00 Europe/Berlin: Fleet-API-Kosten + Founder-Report.
# GitHub cron ist UTC: 16:00 UTC = 18:00 CEST / 17:00 CET.

name: Weekly founder cost digest

on:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Weekly cost digest
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLAY_REPORTS_BUCKET: ${{ secrets.PLAY_REPORTS_BUCKET }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE: de.findus.app
        run: |
          npm run report:weekly-costs
          npm run report:weekly -- --days 7
        continue-on-error: true
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-founder-report
          path: reports/weekly/
          if-no-files-found: ignore
